<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#000}
body{font-family:var(--font-mono);overflow:hidden}
#root{position:fixed;inset:0}
#gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;color:#7a7a7a;font-family:var(--font-mono);font-size:13px;letter-spacing:0.34em;text-indent:0.34em;transition:opacity 0.4s ease}
#gate.hidden{opacity:0;pointer-events:none}
#gate .blink{color:#f2f0f2;animation:mirai-blink 1s step-end infinite}
@keyframes mirai-blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes mirai-glitch-spawn{

6%{opacity:1;clip-path:inset(0);transform:translate(4px,-1px) skewX(-2deg);filter:brightness(1.6) hue-rotate(15deg)}
12%{opacity:0.2;transform:translate(-5px,0);filter:brightness(0.4) contrast(2);clip-path:inset(20% 0 35% 0)}
18%{opacity:1;clip-path:inset(0);transform:translate(2px,0) skewX(-1.2deg);filter:brightness(1.3) hue-rotate(-12deg)}
26%{opacity:0.6;transform:translate(-2px,1px);filter:brightness(0.85) saturate(1.6)}
35%{opacity:1;transform:translate(1px,0) skewX(0.5deg);filter:brightness(1.15)}
48%{opacity:0.5;clip-path:inset(15% 0 0 0);transform:translate(-3px,0);filter:brightness(0.7) contrast(1.3)}
62%{opacity:1;clip-path:inset(0);transform:translate(1px,0);filter:brightness(1.05)}
76%{transform:translate(-1px,0);filter:brightness(0.95)}
100%{opacity:1;transform:none;filter:none;clip-path:inset(0)}
}
/* PULSE — the sporadic corruption that hits the mi·rài ASCII mark every few
   seconds once the terminal is idle. Short, 3 steps, no opacity change. */
@keyframes mirai-glitch-pulse{
0%{filter:none;transform:none}
15%{filter:hue-rotate(90deg) brightness(1.5);transform:translateX(-2px) skewX(1deg)}
30%{filter:hue-rotate(-60deg) brightness(0.8);transform:translateX(3px)}
45%{filter:none;transform:translateX(-1px) skewX(-0.5deg)}
100%{filter:none;transform:none}
}
/* SCAN — a single bright line sweeping the element, used under reveals. */
@keyframes mirai-scan-sweep{from{top:-2px;opacity:0.9}to{top:100%;opacity:0}}
/* CHROMA A/B — permanent colour fringe with periodic tear bursts. The red and
   cyan ghosts sit under/over the ink on `mix-blend-mode:screen`. */
@keyframes mirai-chroma-a{
0%{opacity:.5;transform:translate(-1.5px,0)}
25%{opacity:.6;transform:translate(-2.4px,-.6px)}
48%{opacity:.45;transform:translate(-1px,.4px)}
62%{opacity:.9;transform:translate(-7px,0);clip-path:inset(18% 0 46% 0)}
64%{opacity:.35;transform:translate(4px,0);clip-path:inset(56% 0 20% 0)}
66%{opacity:.85;transform:translate(-5px,1px);clip-path:inset(0 0 72% 0)}
68%{opacity:.5;transform:translate(-1.5px,0);clip-path:inset(0)}
100%{opacity:.5;transform:translate(-1.5px,0)}
}
@keyframes mirai-chroma-b{
0%{opacity:.42;transform:translate(1.5px,0)}
25%{opacity:.52;transform:translate(2.4px,.6px)}
48%{opacity:.38;transform:translate(1px,-.4px)}
62%{opacity:.8;transform:translate(7px,0);clip-path:inset(40% 0 24% 0)}
64%{opacity:.3;transform:translate(-4px,0);clip-path:inset(10% 0 62% 0)}
66%{opacity:.75;transform:translate(5px,-1px);clip-path:inset(64% 0 0 0)}
68%{opacity:.42;transform:translate(1.5px,0);clip-path:inset(0)}
100%{opacity:.42;transform:translate(1.5px,0)}
}
/* ENVELOPE — glitch cloud that collapses into legible type. Blur-dissolve
   entrance (Andrea's faceIn family) crossed with the stepped mi·rài jitter. */
@keyframes mirai-envelope-in{
0%{opacity:0;filter:blur(22px) brightness(2.2) contrast(.5);transform:translateX(-8px) skewX(4deg);clip-path:inset(44% 0 44% 0)}
18%{opacity:1;filter:blur(9px) brightness(1.5);transform:translateX(6px) skewX(-3deg);clip-path:inset(0)}
30%{opacity:.25;filter:blur(14px) brightness(.5);transform:translateX(-5px);clip-path:inset(22% 0 38% 0)}
44%{opacity:1;filter:blur(4px) brightness(1.2);transform:translateX(2px) skewX(1deg);clip-path:inset(0)}
58%{opacity:.6;filter:blur(6px);transform:translateX(-2px)}
72%{opacity:1;filter:blur(1.5px);transform:translateX(1px)}
100%{opacity:1;filter:none;transform:none;clip-path:inset(0)}
}
/* RULE — separator that grows from the centre outward. */
@keyframes mirai-rule-grow{from{transform:scaleX(0);opacity:.2}to{transform:scaleX(1);opacity:1}}

@keyframes mirai-vhs-cut{
0%{filter:brightness(1) contrast(4) saturate(5) hue-rotate(0deg);background:#0a0000;transform:none}
16%{filter:brightness(2) contrast(6) saturate(0);background:#000;transform:translateX(-5px) skewX(-1deg)}
33%{filter:brightness(.6) contrast(5) saturate(8) hue-rotate(290deg);background:#000;transform:translateX(4px)}
50%{filter:brightness(1.4) contrast(4) saturate(4) hue-rotate(15deg);background:#060000;transform:none}
66%{filter:brightness(.8) contrast(6) saturate(0) hue-rotate(180deg);background:#000;transform:translateX(-3px) skewX(1deg)}

@keyframes mirai-vhs-track{from{top:-2px}to{top:100%}}

/* INTERLACE / DITHER — eccerobot.xyz wears a constant, subtle interlacing
   jitter: stepped micro-shifts (serrated, never smooth) under a moving
   scanline dither mask. */
@keyframes mirai-interlace{0%{background-position:0 0}100%{background-position:0 3px}}

0%{transform:translateX(0) skewX(0deg)}
14%{transform:translateX(-0.5px)}
28%{transform:translateX(0.6px) skewX(0.35deg)}
42%{transform:translateX(-0.35px)}
56%{transform:translateX(0.6px)}
70%{transform:translateX(-0.6px) skewX(-0.35deg)}
84%{transform:translateX(0.3px)}
100%{transform:translateX(0) skewX(0deg)}
}

/* SPORADIC CHROMA — mostly invisible cyan ghost that only tears open in brief
   isolated bursts (used under eccerobot.xyz so the green fringe flickers rather
   than drifting constantly). */
@keyframes mirai-chroma-spor{
0%,44%{opacity:0;transform:translate(0,0);clip-path:inset(0)}
47%{opacity:.55;transform:translate(-6px,0);clip-path:inset(22% 0 46% 0)}
50%{opacity:0;transform:translate(3px,0);clip-path:inset(0)}
72%,100%{opacity:0;transform:translate(0,0)}
83%{opacity:.5;transform:translate(5px,-1px);clip-path:inset(58% 0 8% 0)}
86%{opacity:0;transform:translate(0,0);clip-path:inset(0)}
}

/* GLYPH-IN — a single character emerging from the cursor block: it fades and
   tears in while a solid block collapses off it. Runs once per character as the
   wordmark types, so the glitch is present from the very first letter. */
@keyframes mirai-glyph-in{
0%{opacity:0;filter:blur(6px) brightness(2.6);transform:translateX(-4px) skewX(8deg)}
30%{opacity:1;filter:blur(1.5px) brightness(1.4);transform:translateX(3px) skewX(-5deg)}
48%{opacity:.35;filter:blur(3px);transform:translateX(-2px)}
66%{opacity:1;filter:blur(0.5px);transform:translateX(1px) skewX(2deg)}
100%{opacity:1;filter:none;transform:none}
}
@keyframes mirai-block-out{
0%{opacity:.95;transform:scaleY(1)}
40%{opacity:.7;transform:scaleY(1)}
100%{opacity:0;transform:scaleY(0.08)}
}

/* JP-FLICKER — the kanji that spell mirai (未来) bleeding through the latin
   letters as sporadic interference. Mostly invisible, brief hard flashes. */
@keyframes mirai-jp-flicker{
0%,7%,100%{opacity:0}
8%{opacity:.7}9%{opacity:0}
41%{opacity:0}43%{opacity:.55}44.5%{opacity:0}
78%{opacity:0}80%{opacity:.65}81.5%{opacity:0}
}

/* JP-BURST — 未来 shrapnel exploding outward from the wordmark when mi·rài
   lands: each kanji flies out on its own vector, spins, and fades. */
@keyframes mirai-jp-burst{
0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(0.3) rotate(0deg)}
14%{opacity:.85}
100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1.4) rotate(var(--rot))}
}

/* JP-CORRECT — the phonetic kana that surfaces in place of a latin letter as it
   is typed, then is corrected away: a faint, thin, transparent white ghost that
   flashes in and dissolves, leaving the latin glyph. */
@keyframes mirai-jp-correct{
0%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}
8%{opacity:.95}
30%{opacity:.85}
55%{opacity:.9}
72%{opacity:.6}
88%{opacity:.25}
100%{opacity:0;transform:translate(-50%,-50%) scale(0.98)}
}

/* SOFT-FLICKER — the near-still white flicker for ://audiovisual: it holds
   steady with only faint, occasional opacity/brightness dips. No colour tear. */
@keyframes mirai-soft-flicker{
0%,100%{opacity:1;filter:none}
46%{opacity:1}
48%{opacity:.72;filter:brightness(1.3)}
50%{opacity:1;filter:none}
82%{opacity:1}
84%{opacity:.85}
86%{opacity:1}
}

/* LATIN-IN — the latin letter staying hidden while its phonetic kana flashes,
   then resolving in as the kana corrects away (mirai boot only). */
@keyframes mirai-latin-in{
0%{opacity:0}
72%{opacity:0}
82%{opacity:.15}
92%{opacity:.7}
100%{opacity:1}
}

/* GLITCH-OUT — the zalgo overlay tearing away as the clean text resolves. */

0%{opacity:1;transform:translateX(0);clip-path:inset(0)}
25%{opacity:.85;transform:translateX(-5px);clip-path:inset(30% 0 42% 0)}
45%{opacity:.6;transform:translateX(6px);clip-path:inset(58% 0 8% 0)}
65%{opacity:.4;transform:translateX(-3px);clip-path:inset(0 0 74% 0)}
100%{opacity:0;transform:translateX(0);clip-path:inset(0)}
}

/* SMEAR — the zalgo overlay tearing away in serrated horizontal bars that
   streak sideways as they vanish, uncovering the text beneath. Pair with a
   repeating-bar mask for the jagged-band read. */

0%{opacity:1;transform:translateY(0) scaleY(1);clip-path:inset(0)}
20%{opacity:1;transform:translateY(-3px) scaleY(1.2);clip-path:inset(0 0 55% 0)}
40%{opacity:.85;transform:translateY(-6px) scaleY(1.45);clip-path:inset(0 0 22% 0)}
60%{opacity:.6;transform:translateY(-9px) scaleY(1.7);clip-path:inset(0 0 60% 0)}
80%{opacity:.3;transform:translateY(-12px) scaleY(2);clip-path:inset(0 0 30% 0)}
100%{opacity:0;transform:translateY(-16px) scaleY(2.3);clip-path:inset(0)}
}
/* SMEAR-IN — the reverse: eccerobot.xyz condensing out of a wide serrated smear
   into place (used partway through the zalgo churn). Centred, no lateral drift. */
@keyframes mirai-smear-in{
0%{opacity:0;transform:translateX(0) scaleX(1.75);clip-path:inset(0)}
22%{opacity:.5;transform:translateX(-6px) scaleX(1.4);clip-path:inset(40% 0 18% 0)}
46%{opacity:.7;transform:translateX(6px) scaleX(1.22);clip-path:inset(10% 0 55% 0)}
72%{opacity:.9;transform:translateX(-3px) scaleX(1.08);clip-path:inset(30% 0 30% 0)}
100%{opacity:1;transform:translateX(0) scaleX(1);clip-path:inset(0)}
}

/* LETTER-GLITCH — one eccerobot.xyz letter surfacing from below with a short
   glitch stutter. Fired per letter in random order. */
@keyframes mirai-letter-glitch{
0%{opacity:0;transform:translateY(0.55em) scaleY(1.7)}
28%{opacity:1;transform:translateY(-0.08em) scaleY(0.82)}
44%{opacity:.35;transform:translateY(0.1em) scaleY(1.25)}
60%{opacity:1;transform:translateY(0) scaleY(1)}
74%{opacity:.55;transform:translateX(-1.5px)}
88%{opacity:1;transform:translateX(1px)}
100%{opacity:1;transform:none}
}
/* RISE-IN — the zalgo cloud coming up from below when it first appears. */
@keyframes mirai-rise-in{0%{opacity:0;transform:translateY(0.7em)}60%{opacity:1}100%{opacity:1;transform:translateY(0)}}
/* VANISH — once eccerobot.xyz is fully revealed the zalgo simply blink out. */
@keyframes mirai-vanish{0%{opacity:1}100%{opacity:0}}
